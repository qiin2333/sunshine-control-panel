name: Build and Release

on:
  pull_request:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Create a GitHub Release'
        required: false
        default: true
        type: boolean

env:
  CARGO_TERM_COLOR: always

jobs:
  build-windows:
    name: Build Windows (x64)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      # Only cache Cargo registry/git (download deps), NOT src-tauri/target.
      # Caching the build target dir caused a Tauri proc-macro fingerprint
      # corruption that silently dropped some `generate_handler!` entries
      # (install_vmouse_driver / uninstall_vmouse_driver) from the IPC dispatch
      # table while leaving sibling commands intact. Always rebuild the crate
      # from scratch; deps stay cached so CI cost is bounded.
      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-registry-

      - name: Install npm dependencies
        run: npm install

      - name: Inject version from tag
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            VERSION="0.0.0-dev"
          fi
          echo "Injecting version: $VERSION"

          # package.json
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            pkg.version = '$VERSION';
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          "

          # src-tauri/tauri.conf.json
          node -e "
            const fs = require('fs');
            const conf = JSON.parse(fs.readFileSync('src-tauri/tauri.conf.json', 'utf8'));
            conf.version = '$VERSION';
            fs.writeFileSync('src-tauri/tauri.conf.json', JSON.stringify(conf, null, 2) + '\n');
          "

          # src-tauri/Cargo.toml (replace version in [package] section)
          sed -i '0,/^version = ".*"/s//version = "'"$VERSION"'"/' src-tauri/Cargo.toml

          echo "Version injected into package.json, tauri.conf.json, Cargo.toml"

      - name: Build frontend
        run: npm run build:renderer

      - name: Test renderer logic
        run: npm run test:renderer

      - name: Test Tauri backend
        run: cargo test --manifest-path src-tauri/Cargo.toml --target x86_64-pc-windows-msvc

      - name: Build Tauri (release)
        run: cargo build --manifest-path src-tauri/Cargo.toml --release --target x86_64-pc-windows-msvc

      - name: Install NSIS
        shell: pwsh
        run: choco install nsis -y --no-progress

      - name: Build GUI component installer
        shell: pwsh
        run: ./scripts/build-gui-component-installer.ps1 -SkipBuild

      - name: Prepare artifacts
        shell: pwsh
        run: |
          $outDir = "artifacts"
          New-Item -ItemType Directory -Force -Path $outDir

          $targetDir = "src-tauri/target/x86_64-pc-windows-msvc/release"
          Copy-Item "$targetDir/sunshine-gui.exe" "$outDir/"

          # WebView2Loader.dll (if exists — Tauri 2 may embed it)
          if (Test-Path "$targetDir/WebView2Loader.dll") {
            Copy-Item "$targetDir/WebView2Loader.dll" "$outDir/"
          }

          $componentInstaller = Get-ChildItem "src-tauri/installer/dist/Sunshine-GUI-Setup-*.exe" |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1
          if (-not $componentInstaller) {
            throw "Sunshine GUI component installer was not generated"
          }
          Copy-Item $componentInstaller.FullName "$outDir/"

          # Print artifact sizes
          Get-ChildItem $outDir | ForEach-Object {
            Write-Host "$($_.Name): $([math]::Round($_.Length / 1MB, 2)) MB"
          }

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sunshine-gui-windows-x64
          path: artifacts/*
          if-no-files-found: error

  release:
    name: Create Release
    needs: build-windows
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.event.inputs.create_release == 'true')
    permissions:
      contents: write

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: sunshine-gui-windows-x64
          path: artifacts

      - name: Determine version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=v$(date +%Y.%m%d.%H%M%S)" >> "$GITHUB_OUTPUT"
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Sunshine GUI ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          files: artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
