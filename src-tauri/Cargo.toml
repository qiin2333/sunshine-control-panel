[package]
name = "sunshine-gui"
version = "0.0.0-dev"
description = "A GUI for sunshine"
authors = ["qiin2333"]
license = ""
repository = "https://github.com/qiin2333/sunshine"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
tauri = { version = "2.10.3", features = [ "tray-icon", "native-tls-vendored"] }
tauri-plugin-shell = "2.3.5"
tauri-plugin-dialog = "2.6.0"
tauri-plugin-fs = "2.4.5"
tauri-plugin-single-instance = "2.4.0"
tauri-plugin-global-shortcut = "2.3.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12.28", features = ["json", "native-tls", "stream", "gzip", "deflate"], default-features = false }
axum = "0.8.8"
tower = "0.5"
tower-http = { version = "0.6.8", features = ["cors"] }
once_cell = "1.21.3"
wmi = "0.18"
quick-xml = { version = "0.37", features = ["serialize"] }
encoding_rs = "0.8.35"
regex = "1.11.3"
base64 = "0.22.1"
rcgen = "0.13"
chrono = { version = "0.4.43", features = ["serde"] }
url = "2.5.8"
dirs = "6.0"
futures-util = "0.3.31"
bytes = "1.11"
log = "0.4"
env_logger = "0.11.8"
raw-window-handle = "0.6"
xcap = "0.7"

[features]
# by default Tauri runs in production mode
# when `tauri dev` runs it is executed with `cargo run --no-default-features` if `devPath` is an URL
default = ["custom-protocol"]
# this feature is used for production builds or when `devPath` points to the filesystem
# DO NOT REMOVE!!
custom-protocol = ["tauri/custom-protocol"]
# 内测功能：打包时包含测试功能（如 Web 串流）
beta = []

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
    "Win32",
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Pipes",
    "Win32_System_Threading",
    "Win32_System_ProcessStatus",
    "Win32_System_Power",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_Security",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Imaging",
    "Win32_UI",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_HiDpi",
    "Win32_UI_WindowsAndMessaging",
] }
# WebView2 COM 接口，用于访问 ICoreWebView2Settings4 等高级设置
webview2-com = "0.38"
# webview2-com 使用 windows-core 0.61，需要此版本的 Interface trait 来调用 .cast()
wv2-windows-core = { package = "windows-core", version = "0.61" }
winreg = "0.55"
image = "0.25.9"
