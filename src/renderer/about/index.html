<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="../../assets/sunshine.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>关于 Sunshine 控制面板</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: linear-gradient(135deg, #4a9eff 0%, #7ab8ff 50%, #a2d2ff 100%);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #3a7ed5;
      }

      .about-container {
        background: rgba(240, 248, 255, 0.95);
        backdrop-filter: blur(10px);
        border-radius: 20px;
        padding: 40px;
        max-width: 500px;
        width: 90%;
        box-shadow: 0 20px 40px rgba(74, 158, 255, 0.15);
        text-align: center;
        border: 1px solid rgba(74, 158, 255, 0.2);
      }

      .logo {
        width: 80px;
        height: 80px;
        margin: 0 auto 20px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
      }

      .logo img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        border-radius: 50%;
      }

      h1 {
        color: #4a9eff;
        margin-bottom: 10px;
        font-size: 28px;
        font-weight: 600;
        text-shadow: 0 2px 4px rgba(74, 158, 255, 0.2);
      }

      .version {
        color: #5ba3ff;
        margin-bottom: 30px;
        font-size: 16px;
      }

      .description {
        color: #3a7ed5;
        line-height: 1.6;
        margin-bottom: 30px;
        font-size: 14px;
      }

      .info-grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 20px;
        margin-bottom: 30px;
      }

      .info-grid.multi-row {
        grid-template-columns: repeat(3, 1fr);
      }

      .info-item {
        text-align: left;
      }

      .info-label {
        color: #5ba3ff;
        font-size: 12px;
        margin-bottom: 5px;
      }

      .info-value {
        color: #3a7ed5;
        font-size: 14px;
        font-weight: 500;
      }

      .links {
        display: flex;
        justify-content: center;
        gap: 20px;
        margin-bottom: 20px;
      }

      .link {
        color: #4a9eff;
        text-decoration: none;
        font-size: 14px;
        padding: 8px 16px;
        border: 1px solid #4a9eff;
        border-radius: 8px;
        transition: all 0.3s ease;
        box-shadow: 0 2px 8px rgba(74, 158, 255, 0.2);
      }

      .link:hover {
        background: linear-gradient(135deg, #4a9eff, #7ab8ff);
        color: white;
        box-shadow: 0 4px 16px rgba(74, 158, 255, 0.4);
        transform: translateY(-2px);
      }

      .copyright {
        color: #5ba3ff;
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <div class="about-container">
      <div class="logo">
        <img
          width="80"
          height="80"
          src="https://assets.alkaidlab.com/109527119_p1.png"
          alt="Sunshine Control Panel"
        />
      </div>
      <h1 data-i18n="appTitle">Sunshine 控制面板</h1>
      <div class="version" id="app-version">版本加载中...</div>
      <div class="description" data-i18n="description">
        Sunshine 控制面板 - 给游戏串流用的 GUI 管理工具，杂鱼操作也能稳稳搞定~
      </div>

      <div class="info-grid" id="info-grid">
        <div class="info-item">
          <div class="info-label">构建时间</div>
          <div class="info-value">加载中...</div>
        </div>
        <div class="info-item">
          <div class="info-label">架构</div>
          <div class="info-value">加载中...</div>
        </div>
        <div class="info-item">
          <div class="info-label">Tauri 版本</div>
          <div class="info-value">加载中...</div>
        </div>
      </div>

      <div class="links">
        <a href="https://github.com/AlkaidLab/foundation-sunshine" class="link" target="_blank">GitHub</a>
        <a href="https://www.alkaidlab.com/" class="link" target="_blank" data-i18n="website">官网</a>
      </div>

      <div class="copyright">© 2025 Foundation Sunshine | qiin2333 | alkaidlab.com</div>
    </div>

    <script type="module">
      import {
        getInitialSimpleLocale,
        pickSimpleMessages,
        setDocumentLocale,
        syncSimpleLocaleFromSunshine,
      } from '../shared/simple-i18n.js'

      const MESSAGES = {
        zh: {
          title: '关于 Sunshine 控制面板',
          appTitle: 'Sunshine 控制面板',
          version: '版本 {version}',
          versionLoading: '版本加载中...',
          description: 'Sunshine 控制面板 - 给游戏串流用的 GUI 管理工具，杂鱼操作也能稳稳搞定~',
          buildTime: '构建时间',
          architecture: '架构',
          tauriVersion: 'Tauri 版本',
          operatingSystem: '操作系统',
          totalMemory: '总内存',
          processor: '处理器',
          loading: '加载中...',
          unknown: '未知',
          website: '官网',
        },
        en: {
          title: 'About Sunshine Control Panel',
          appTitle: 'Sunshine Control Panel',
          version: 'Version {version}',
          versionLoading: 'Version Loading...',
          description: 'Sunshine Control Panel - a powerful GUI management tool for game streaming',
          buildTime: 'Build Time',
          architecture: 'Architecture',
          tauriVersion: 'Tauri Version',
          operatingSystem: 'Operating System',
          totalMemory: 'Total Memory',
          processor: 'Processor',
          loading: 'Loading...',
          unknown: 'Unknown',
          website: 'Website',
        },
      }

      const $ = (id) => document.getElementById(id)
      let text = pickSimpleMessages(MESSAGES)
      let latestData = null

      const applyStaticText = () => {
        document.querySelectorAll('[data-i18n]').forEach((element) => {
          const key = element.dataset.i18n
          element.textContent = text[key] || ''
        })
      }

      const applyLocale = (locale) => {
        text = pickSimpleMessages(MESSAGES, locale)
        setDocumentLocale(locale)
        document.title = text.title
        applyStaticText()
        if (!latestData) {
          $('app-version').textContent = text.versionLoading
          renderInfoGrid(getLoadingRows())
        } else {
          updateUI(latestData)
        }
      }

      const createInfoItem = (label, value, fontSize = '14px') => {
        const element = document.createElement('div')
        const labelElement = document.createElement('div')
        const valueElement = document.createElement('div')

        element.className = 'info-item'
        labelElement.className = 'info-label'
        labelElement.textContent = label
        valueElement.className = 'info-value'
        valueElement.style.fontSize = fontSize
        valueElement.textContent = value

        element.append(labelElement, valueElement)
        return element
      }

      const formatMemory = (bytes) => `${(bytes / (1024 ** 3)).toFixed(1)} GB`

      const getLoadingRows = () => [
        { label: text.buildTime, value: text.loading },
        { label: text.architecture, value: text.loading },
        { label: text.tauriVersion, value: text.loading },
      ]

      const getInfoRows = (data) => [
        { label: text.buildTime, value: data.buildTime || text.unknown },
        { label: text.architecture, value: data.arch || text.unknown },
        { label: text.tauriVersion, value: data.tauriVersion || text.unknown },
        data.osVersion && { label: text.operatingSystem, value: data.osVersion },
        data.memoryTotal && { label: text.totalMemory, value: formatMemory(data.memoryTotal) },
        data.cpuModel && { label: text.processor, value: data.cpuModel, fontSize: '12px' },
      ].filter(Boolean)

      const renderInfoGrid = (rows) => {
        const infoGrid = $('info-grid')
        infoGrid.replaceChildren(...rows.map((row) => createInfoItem(row.label, row.value, row.fontSize)))
        infoGrid.classList.toggle('multi-row', rows.length > 3)
      }

      const updateUI = (data) => {
        latestData = data
        $('app-version').textContent = text.version.replace('{version}', data.appVersion || text.unknown)
        renderInfoGrid(getInfoRows(data))
      }

      const loadSystemInfo = async () => {
        try {
          const { invoke } = await import('@tauri-apps/api/core')
          const systemInfo = await invoke('get_system_info')

          updateUI({
            appVersion: systemInfo.app_version,
            buildTime: systemInfo.build_time || new Date().toLocaleDateString(),
            arch: systemInfo.arch,
            tauriVersion: systemInfo.tauri_version,
            osVersion: systemInfo.os_version,
            memoryTotal: systemInfo.memory_total,
            cpuModel: systemInfo.cpu_model,
          })
        } catch (error) {
          console.error('获取系统信息失败，使用默认值:', error)

          updateUI({
            appVersion: '',
            buildTime: new Date().toLocaleDateString(),
            arch: navigator.platform.includes('64') ? 'x64' : 'x86',
            tauriVersion: '',
          })
        }
      }

      const init = () => {
        applyLocale(getInitialSimpleLocale())
        syncSimpleLocaleFromSunshine(MESSAGES, applyLocale)
        loadSystemInfo()
      }

      document.addEventListener('DOMContentLoaded', init)
    </script>
  </body>
</html>
